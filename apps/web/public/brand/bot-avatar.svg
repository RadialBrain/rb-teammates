<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="RadialBrain">
  <defs>
    <radialGradient id="rb-glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#8B7CFF"/>
      <stop offset="55%" stop-color="#3F2D9B"/>
      <stop offset="100%" stop-color="#1A1438"/>
    </radialGradient>
    <linearGradient id="rb-ring" x1="16" y1="20" x2="112" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7A8FF"/>
      <stop offset="1" stop-color="#5B4FDB"/>
    </linearGradient>
  </defs>
  <!-- Soft disc -->
  <circle cx="64" cy="64" r="56" fill="url(#rb-glow)"/>
  <!-- Outer radial ticks (unique RB motif) -->
  <g fill="none" stroke="url(#rb-ring)" stroke-width="2.2" stroke-linecap="round" opacity="0.9">
    <path d="M64 14v10"/>
    <path d="M64 104v10"/>
    <path d="M14 64h10"/>
    <path d="M104 64h10"/>
    <path d="M28.5 28.5l7.1 7.1"/>
    <path d="M92.4 92.4l7.1 7.1"/>
    <path d="M99.5 28.5l-7.1 7.1"/>
    <path d="M35.6 92.4l-7.1 7.1"/>
  </g>
  <!-- Inner orbit -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#C9BFFF" stroke-width="1.5" opacity="0.55"/>
  <!-- Core node -->
  <circle cx="64" cy="64" r="11" fill="#F4F5FF"/>
  <!-- Satellite nodes -->
  <circle cx="64" cy="36" r="5.5" fill="#E8E4FF"/>
  <circle cx="88" cy="64" r="5.5" fill="#E8E4FF"/>
  <circle cx="64" cy="92" r="5.5" fill="#E8E4FF"/>
  <circle cx="40" cy="64" r="5.5" fill="#E8E4FF"/>
  <!-- Connectors -->
  <g stroke="#F4F5FF" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M64 47v6"/>
    <path d="M64 75v6"/>
    <path d="M47 64h6"/>
    <path d="M75 64h6"/>
  </g>
</svg>
